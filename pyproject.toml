[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vj-nca"
version = "0.1.0"
description = "Conditioned neural cellular automata for periodic video and recovery experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<3", "numpy>=2.1,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
cloud = ["modal>=1.6.1,<2"]
dev = ["ruff>=0.12"]

[project.scripts]
vj-nca = "vj_nca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
